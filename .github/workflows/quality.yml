name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static project checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check theme initializer syntax
        run: node --check theme-init.js
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Check site structure and local assets
        run: python3 tests/check_project.py
      - name: Check patch whitespace
        run: git diff --check
